services:
  mysql:
    image: mysql:8.4
    container_name: picklebuddy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: picklebuddy
    volumes:
      - mysql_data:/var/lib/mysql
      - ./picklebuddy.sql:/docker-entrypoint-initdb.d/001-picklebuddy.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
    container_name: picklebuddy-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: PickleBuddy API
      APP_ENV: docker
      APP_DEBUG: "false"
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ALLOWED_ORIGIN_REGEX: ^https?://(localhost|127\.0\.0\.1):\d+$
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: picklebuddy
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ../picklebuddzy
      args:
        VITE_API_BASE_URL: http://localhost:8001/api
    container_name: picklebuddy-frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  mysql_data:
